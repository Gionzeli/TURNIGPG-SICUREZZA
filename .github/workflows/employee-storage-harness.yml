name: Employee synthetic storage harness

on:
  pull_request:
    branches:
      - main
    paths:
      - "tests/storage-harness/**"
      - ".github/workflows/employee-storage-harness.yml"
  push:
    branches:
      - dsm-enterprise/core-v1
    paths:
      - "tests/storage-harness/**"
      - ".github/workflows/employee-storage-harness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-model-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Run synthetic in-memory tests
        run: node --test tests/storage-harness/*.test.mjs
