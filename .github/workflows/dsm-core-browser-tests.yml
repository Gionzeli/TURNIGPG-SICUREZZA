name: DSM Core browser tests

on:
  push:
    branches:
      - dsm-enterprise/core-v1
      - codex/employee-shift-date-range-query
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexeddb-browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify service worker syntax and local AI package boundary
        run: |
          node --check sw.js
          node --input-type=module --check < local-ai-bootstrap.js
          node --check tools/verify-local-ai-assets.mjs
          node tools/verify-local-ai-assets.mjs
          if node tools/verify-local-ai-assets.mjs --require-ready; then
            echo "ERROR: AI asset verifier must block an incomplete offline package"
            exit 1
          else
            echo "PASS: offline AI package is correctly blocked until all assets are bundled"
          fi
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Run IndexedDB browser tests
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/dsm-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          node tests/browser/run-playwright.mjs
