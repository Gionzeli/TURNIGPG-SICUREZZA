name: DSM Core browser tests

on:
  push:
    branches:
      - dsm-enterprise/core-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  indexeddb-browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run IndexedDB browser tests
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/dsm-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          node tests/browser/run-playwright.mjs
