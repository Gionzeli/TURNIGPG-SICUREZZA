<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>DSM — dimostrazione locale isolata</title>
  <link rel="stylesheet" href="./composition-demo.css">
  <script type="module" src="./composition-demo.js"></script>
</head>
<body>
  <header>
    <p class="demo-banner" role="note"><strong>AMBIENTE DIMOSTRATIVO</strong> — account locale non autenticato. Dati esclusivamente sintetici; nessun collegamento a Firebase o a dati operativi.</p>
    <h1>DSM — dimostrazione del composition root</h1>
    <p id="demo-status" role="status" aria-live="polite">Inizializzazione della sessione locale…</p>
    <button id="demo-close" type="button" disabled>Termina dimostrazione</button>
  </header>
  <main id="demo-history" aria-label="Cronologia dimostrativa"></main>
  <footer>Fixture tecnica sotto tests/browser — non è una pagina di prodotto.</footer>
</body>
</html>
