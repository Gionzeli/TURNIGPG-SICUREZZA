<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Anteprima cronologia DSM</title>
  <link rel="stylesheet" href="./history-preview.css">
  <script type="module" src="./history-preview.js"></script>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">DSM · anteprima isolata</p>
      <h1>Cronologia delle modifiche</h1>
      <p class="notice">Dimostrazione con eventi inventati. Non legge né modifica i dati dell'applicazione.</p>
    </header>
    <section aria-labelledby="history-heading">
      <h2 id="history-heading">Attività recente</h2>
      <div class="filters" aria-label="Filtri cronologia">
        <label for="filter-search">Cerca nella cronologia<input id="filter-search" type="search" placeholder="Es. turno, profilo, creato…"></label>
        <label for="filter-from">Dal giorno<input id="filter-from" type="date"></label>
        <label for="filter-to">Al giorno<input id="filter-to" type="date"></label>
        <label for="filter-entity">Elemento
          <select id="filter-entity">
            <option value="all">Tutti</option>
            <option value="Turno">Turno</option>
            <option value="Profilo">Profilo</option>
            <option value="Impostazione">Impostazione</option>
          </select>
        </label>
        <label for="filter-action">Azione
          <select id="filter-action">
            <option value="all">Tutte</option>
            <option value="Creato">Creato</option>
            <option value="Modificato">Modificato</option>
            <option value="Eliminato">Eliminato</option>
          </select>
        </label>
        <label for="filter-sort">Ordine
          <select id="filter-sort">
            <option value="newest">Più recenti</option>
            <option value="oldest">Più vecchi</option>
          </select>
        </label>
        <label for="filter-page-size">Eventi per pagina
          <select id="filter-page-size">
            <option value="3">3 eventi</option>
            <option value="5">5 eventi</option>
            <option value="10">10 eventi</option>
          </select>
        </label>
        <button id="clear-filters" type="button">Azzera filtri</button>
      <button id="export-csv" type="button">Esporta CSV</button>
      </div>
      <p id="history-status" role="status" aria-live="polite">Caricamento anteprima…</p>
      <div id="history-events"></div>
      <nav id="history-pagination" class="pagination" aria-label="Pagine cronologia">
        <button id="page-previous" type="button" disabled>Precedente</button>
        <span id="page-indicator" aria-live="polite">Pagina 1 di 1</span>
        <button id="page-next" type="button" disabled>Successiva</button>
      </nav>
    </section>
    <footer>Modalità dimostrativa · nessun database aperto · nessuna sincronizzazione</footer>
  </main>
</body>
</html>
