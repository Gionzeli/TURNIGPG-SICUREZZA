<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parser turni — test sintetico colonne consentite</title>
  <style>
    body{font:16px/1.5 system-ui,sans-serif;max-width:760px;margin:2rem auto;padding:0 1rem}
    pre{white-space:pre-wrap;background:#8881;padding:1rem;border-radius:8px}
    #status{font-weight:700}
  </style>
</head>
<body>
  <h1>Test sintetico parser turni</h1>
  <p>Usa soltanto righe inventate. Verifica che il parser non deduca postazione, piantonamento o notturno da testo residuo.</p>
  <button id="run" type="button">Esegui controlli</button>
  <p id="status" role="status">In attesa</p>
  <pre id="result">Nessun test eseguito.</pre>
  <script type="module">
    import "../../local-reader.js";
    const status=document.querySelector("#status");
    const result=document.querySelector("#result");
    document.querySelector("#run").addEventListener("click",()=>{
      try{
        const parser=window.LocalDocAI?.parseTurns;
        if(typeof parser!=="function")throw new Error("Parser turni non disponibile");
        const inferred=parser("01/12/2026 06:00 14:00 Cliente Alfa PIANTONAMENTO NOTTURNO");
        if(inferred.length!==1)throw new Error("Atteso un solo turno sintetico");
        const a=inferred[0];
        if(a.date!=="2026-12-01"||a.start_time!=="06:00"||a.end_time!=="14:00"||a.post!==""||a.piantonamento!==false||a.notturno!==false||a.type!=="turno"){
          throw new Error("Il parser ha inferito campi non consentiti: "+JSON.stringify(a));
        }
        const labelled=parser("02/12/2026 POSTAZIONE: Sede Alfa 14:00 22:00");
        if(labelled.length!==1||labelled[0].post!=="Sede Alfa")throw new Error("Etichetta esplicita POSTAZIONE non riconosciuta");
        const geometry=parser(["RIGA 1: @100:Data | @300:Orario | @600:Postazione","RIGA 2: @100:03/12/2026 | @300:06:00 | @360:14:00 | @600:Sede Beta"].join("\n"));
        if(geometry.length!==1||geometry[0].date!=="2026-12-03"||geometry[0].start_time!=="06:00"||geometry[0].end_time!=="14:00"||geometry[0].post!=="Sede Beta")throw new Error("Mappatura geometrica delle colonne non riuscita: "+JSON.stringify(geometry));
        const split=parser(["RIGA 1: @100:Data | @250:Inizio | @400:Fine | @650:Postazione","RIGA 2: @100:04/12/2026 | @250:06:00 | @400:14:00 | @650:Sede Gamma"].join("\n"));
        if(split.length!==1||split[0].date!=="2026-12-04"||split[0].start_time!=="06:00"||split[0].end_time!=="14:00"||split[0].post!=="Sede Gamma")throw new Error("Mappatura colonne Inizio/Fine non riuscita: "+JSON.stringify(split));
        const excluded=parser([
          "RIGA 1: @100:Data | @300:Orario | @600:Postazione | @780:Totale | @930:Note | @1120:Notturno",
          "RIGA 2: @100:05/12/2026 | @300:06:00 | @360:14:00 | @600:Sede Delta | @780:8,00 | @930:Cliente Zeta PIANTONAMENTO | @1120:SI"
        ].join("\n"));
        if(excluded.length!==1||excluded[0].date!=="2026-12-05"||excluded[0].start_time!=="06:00"||excluded[0].end_time!=="14:00"||excluded[0].post!=="Sede Delta"||excluded[0].piantonamento!==false||excluded[0].notturno!==false){
          throw new Error("Le colonne escluse sono confluite nei dati turno: "+JSON.stringify(excluded));
        }
        const multiword=parser([
          "RIGA 1: @100:Data | @300:Fascia | @345:oraria | @650:Postazione | @820:Totale ore",
          "RIGA 2: @100:06/12/2026 | @300:06:00 | @360:14:00 | @650:Sede Epsilon | @820:8,00"
        ].join("\n"));
        if(multiword.length!==1||multiword[0].date!=="2026-12-06"||multiword[0].start_time!=="06:00"||multiword[0].end_time!=="14:00"||multiword[0].post!=="Sede Epsilon"){
          throw new Error("Intestazione OCR multi-parola non riconosciuta: "+JSON.stringify(multiword));
        }
        const splitLabels=parser([
          "RIGA 1: @100:Data | @250:Ora | @290:inizio | @420:Ora | @460:fine | @680:Postazione",
          "RIGA 2: @100:07/12/2026 | @250:06:00 | @420:14:00 | @680:Sede Zeta"
        ].join("\\n"));
        if(splitLabels.length!==1||splitLabels[0].date!=="2026-12-07"||splitLabels[0].start_time!=="06:00"||splitLabels[0].end_time!=="14:00"||splitLabels[0].post!=="Sede Zeta"){
          throw new Error("Intestazioni Ora inizio/Ora fine non riconosciute: "+JSON.stringify(splitLabels));
        }
        status.textContent="PASS — coordinate OCR: solo data, orari e Postazione; intestazioni multi-parola e colonne escluse verificate.";
        result.textContent=JSON.stringify({withoutPostazione:a,withPostazione:labelled[0],geometryColumns:geometry[0],splitTimeColumns:split[0],excludedColumns:excluded[0],multiwordHeader:multiword[0],splitStartEndLabels:splitLabels[0]},null,2);
      }catch(error){
        status.textContent="FAIL — controllo parser non superato.";
        result.textContent=String(error?.stack||error?.message||error);
      }
    });
  </script>
</body>
</html>
